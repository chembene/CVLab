name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvlab
          POSTGRES_PASSWORD: cvlab_ci_password
          POSTGRES_DB: cvlab_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cvlab:cvlab_ci_password@localhost:5432/cvlab_ai_test?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Unit tests
        run: npm run test:unit

      - name: API e2e tests
        run: npm run test:e2e -w @cvlab/api

      - name: Build
        run: npm run build
